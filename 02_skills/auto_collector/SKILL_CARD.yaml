skill:
  name: "自动采集器"
  id: "auto_collector"
  version: "1.0.0"
  category: "core-system"
  status: "experimental"
  created: "2026-04-29"
  updated: "2026-04-29"

description:
  short: "定时自动抓取RSS/新闻/社交媒体，推送inbox/knowledge/feed/"
  use_cases:
    - "定时拉取配置的RSS源，转MD推送feed分区"
    - "抓取指定网页列表，转MD推送clipping分区"
    - "仅格式转换，不做AI提炼"
  tags: ["自动采集", "RSS", "定时", "feed"]

ownership:
  master_editor: "my-macbook_macOS14.4_16GB_master"
  readonly_on_other_devices: false

environment:
  os: "macos"
  python_path: "~/.workbuddy/binaries/python/envs/agent-os/bin/python3"
  pip_dependencies:
    - "feedparser>=6.0.0"
    - "trafilatura>=1.6.0"

setup:
  install_script: ""
  post_check: "python3 -c 'import feedparser; print(\"OK\")'"

usage:
  entry_point: "auto_collector.py"
  scheduled: "每日 01:00（可配置）"
  manual_trigger: "自动采集"

target_inbox:
  feed:     "03_knowledge/00_stream/inbox/knowledge/feed/"
  clipping: "03_knowledge/00_stream/inbox/knowledge/clipping/"

changelog:
  - version: "1.0.0"
    date: "2026-04-29"
    changes: "初始版本（experimental，待实现）"
