skill:
  name: "矩阵养号"
  id: "matrix"
  version: "1.0.0"
  category: "automation"
  status: "active"
  created: "2026-04-29"
  updated: "2026-04-29"

description:
  short: "多平台社交账号矩阵养号——蓝图调度、Chrome CDP 控制、账号切换"
  use_cases:
    - "自动执行抖音日常浏览/点赞/收藏/评论蓝图"
    - "多账号 Chrome Profile 隔离切换"
    - "定时调度器后台持续运营账号"
    - "管理蓝图（查看/新增/修改）"
  tags: ["自动化", "抖音", "养号", "CDP", "蓝图", "多账号"]

ownership:
  master_editor: "Redmi-12C_macOS26.4_M1_16GB"
  readonly_on_other_devices: false

tool_path: "~/workbuddy-agent-os/agent-sync/05_tools/07_matrix"
data_path: "~/workbuddy-agent-os/agent-sync/agent-local/tools/matrix"

environment:
  os: "macos"
  python_path: "~/.workbuddy/binaries/python/envs/agent-os/bin/python3"
  pip_dependencies:
    - "patchright>=1.40.0"
    - "camoufox>=0.4.0"
    - "PyYAML>=6.0"
  system_deps:
    - "Google Chrome（CDP 直连）"
    - "Camoufox（阶段B，Firefox内核）"

setup:
  install_script: "~/workbuddy-agent-os/agent-sync/05_tools/07_matrix/install.sh"
  post_check: "python3 ~/workbuddy-agent-os/agent-sync/05_tools/07_matrix/scripts/switch_account.py --list"

usage:
  entry_points:
    scheduler: "scripts/task_scheduler.py"
    engine:    "scripts/task_engine.py --blueprint <name> --account <id>"
    accounts:  "scripts/switch_account.py --list"
  blueprints_dir: "~/workbuddy-agent-os/agent-sync/05_tools/07_matrix/blueprints/"
  config_file:    "~/workbuddy-agent-os/agent-sync/agent-local/tools/matrix/config/accounts.yaml"

platforms:
  - name: "抖音"
    status: "active"
    browser: "chrome"
    atomic_ops: 18
  - name: "小红书"
    status: "framework_ready"
    browser: "chrome"
  - name: "知乎"
    status: "framework_ready"
    browser: "chrome"
  - name: "快手"
    status: "planned"

changelog:
  - version: "1.0.0"
    date: "2026-04-29"
    changes: "初始版本——从 ~/Documents/matrix 迁入 agent-os，完成代码/数据分离，新增 SKILL.md/TOOL.md/install.sh"
