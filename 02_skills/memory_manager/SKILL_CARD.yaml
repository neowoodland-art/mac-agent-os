skill:
  name: "记忆管理器"
  id: "memory_manager"
  version: "1.2.0"
  category: "core-system"
  status: "active"
  created: "2026-04-25"
  updated: "2026-04-29"

description:
  short: "每日对话提炼、记忆固化检测、向量化、版本管理"
  use_cases:
    - "每日凌晨自动提炼前一天对话记忆"
    - "检测高频/重要记忆，推送到协同inbox/memory/"
    - "冷启动时从已有记忆初始化知识库"
  tags: ["记忆", "提炼", "固化", "向量化"]

ownership:
  master_editor: "my-macbook_macOS14.4_16GB_master"
  readonly_on_other_devices: true

environment:
  os: "macos"
  python_path: "~/.workbuddy/binaries/python/envs/agent-os/bin/python3"
  pip_dependencies:
    - "sqlite-utils>=3.35"
    - "chromadb>=1.0.0"

setup:
  install_script: ""
  post_check: "python3 -c 'import sqlite3; print(\"OK\")'"

usage:
  entry_point: "daily_digest.py"
  scheduled: "每日 02:00（WorkBuddy 自动化）"
  manual_trigger: "记忆更新"

scripts:
  - daily_digest.py       # 每日提炼主程序
  - memory_extractor.py   # 记忆固化提取（推送inbox/memory/）
  - bootstrap_from_memory.py
  - agent_memory_init.py
  - export_memories.py
  - import_memories.py
  - memory_cleanup.py
  - semantic_search.py

changelog:
  - version: "1.2.0"
    date: "2026-04-29"
    changes: "新增 memory_extractor.py，支持固化条件检测+推送inbox/memory/"
  - version: "1.1.0"
    date: "2026-04-27"
    changes: "接入 oMLX Embedding，支持向量化"
  - version: "1.0.0"
    date: "2026-04-25"
    changes: "初始版本"
