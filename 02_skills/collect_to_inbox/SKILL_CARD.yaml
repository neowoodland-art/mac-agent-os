skill:
  name: "内容采集推送器"
  id: "collect_to_inbox"
  version: "1.0.0"
  category: "core-system"
  status: "legacy"
  created: "2026-04-25"
  updated: "2026-04-29"

description:
  short: "扫描本机素材，格式转换（HTML/视频→MD），推送协同inbox"
  use_cases:
    - "扫描 agent-os-local/materials/refined_for_inbox/ 目录"
    - "HTML→MD 格式转换（不做AI提炼，原文推送）"
    - "按内容来源推送到对应inbox分区（clipping/feed/personal）"
    - "推送完成后标记已处理，避免重复"
  tags: ["采集", "推送", "格式转换", "inbox"]

ownership:
  master_editor: "my-macbook_macOS14.4_16GB_master"
  readonly_on_other_devices: false

environment:
  os: "macos"
  python_path: "~/.workbuddy/binaries/python/envs/agent-os/bin/python3"
  pip_dependencies:
    - "trafilatura>=1.6.0"
    - "markdownify>=0.11.0"

setup:
  install_script: ""
  post_check: "python3 -c 'import trafilatura; print(\"OK\")'"

usage:
  entry_point: "collect_to_inbox.py"
  scheduled: "手动触发或每日定时"
  manual_trigger: "采集推送"

source_dirs:
  refined_for_inbox: "~/workbuddy-agent-os/agent-sync/agent-local/materials/refined_for_inbox/"

target_inbox:
  clipping: "03_knowledge/00_stream/inbox/knowledge/clipping/"
  feed:     "03_knowledge/00_stream/inbox/knowledge/feed/"
  personal: "03_knowledge/00_stream/inbox/personal/"
  memory:   "03_knowledge/00_stream/inbox/memory/"

changelog:
  - version: "1.1.0"
    date: "2026-04-29"
    changes: "重写：扫描agent-os-local/materials/refined_for_inbox/，纯格式转换推送"
  - version: "1.0.0"
    date: "2026-04-25"
    changes: "初始版本"
