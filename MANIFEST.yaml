    file: 03_knowledge/99_system/ARCHITECTURE_CONSTITUTION.md
  - topic: 联邦实操
    file: FEDERATION_GUIDE.md
  - topic: AI 行为规则
    file: 01_core/SOUL.md
  - topic: 记忆与知识库架构
    file: 03_knowledge/99_system/agent-os-memory-knowledge-architecture.md
  - topic: 养号系统架构
    file: 03_knowledge/99_system/matrix/matrix-nurture-system-architecture.md
  - topic: 内容采集系统规划 v2
    file: 采集系统框架规划-v2.md  # 在用户根目录
  - topic: 知识库 AI 入口
    file: 03_knowledge/99_system/AI_READING_GUIDE.md
  - topic: 项目指令
    file: AGENTS.md
