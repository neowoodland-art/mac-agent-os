# ——— 分段指令 ———
segments:
  - id: 1
    text: "我跟我爸的最后一次通话，是2018年3月12号。那天他打了三个电话，我一个都没接。后来我再也没有机会接了。"
    duration_sec: 12
    voice_emotion: "平静开场，语速缓慢"
    camera: "slow_zoom_in"
    bgm_section: "intro"
    material:
      search: "old father working construction site, cinematic"
    subtitles: true

  - id: 2
    text: "我爸是个农民工，在工地绑钢筋，一绑就是三十年。我从小最怕两件事：一个是开学，因为要交学费；一个是下雨，因为一下雨他就没活干，没活干他就喝酒，一喝酒他就会打电话回来。"
    duration_sec: 18
    voice_emotion: "正常叙述，略带苦涩"
    camera: "medium_shot"
    bgm_section: "main"
    material:
      search: "construction worker in rain, Chinese countryside"
    subtitles: true

  - id: 3
    text: "他的电话永远是那几句：吃饭了吗？天冷了多穿点。钱够不够花？翻来覆去，二十年如一日。我嫌他啰嗦。每次看到屏幕上亮起他的名字，我就按掉。"
    duration_sec: 14
    voice_emotion: "带一丝愧疚"
    camera: "close_up"
    bgm_section: "main"
    material:
      search: "rejected phone call, lonely father"
    subtitles: true

  - id: 4
    text: "2012年我在北京实习，他打电话问我过得好不好。我说挺好的，公司管吃管住。他说你别骗我。我说真的挺好。他沉默了几秒，说：缺钱跟爸说，爸有。我知道他没有。他一个月工资三千五，自己留五百，剩下三千全打到我卡上。我从来没说过谢谢。"
    duration_sec: 22
    voice_emotion: "逐渐哽咽，真情流露"
    camera: "slow_pan_right"
    bgm_section: "climax"
    material:
      search: "father sends money to son, love letter"
    subtitles: true

  - id: 5
    text: "2018年3月12号。他打了三个电话。第一个我在开会，按掉了。第二个我在跟朋友吃饭，没接。第三个晚上九点，我想着明天回吧。然后就再也没有第四通了。那天晚上他从脚手架上摔了下来。我妈说他的手机最后停留在我的通话记录上。三个未接来电。全是打给我的。"
    duration_sec: 20
    voice_emotion: "压抑悲痛，声音微颤"
    camera: "hand_held"
    bgm_section: "climax"
    material:
      search: "phone with missed calls, tragedy at construction site"
    subtitles: true

  - id: 6
    text: "我后来经常做一个梦。梦里我坐在老家门口，远远看见他走过来。他走到跟前，笑着问我：吃饭了吗？我在梦里说：吃了，爸。你呢？然后我就醒了。醒来发现枕头是湿的。"
    duration_sec: 15
    voice_emotion: "深情追忆，轻声"
    camera: "top_down"
    bgm_section: "outro"
    material:
      search: "wet pillow morning, father son reunion dream"
    subtitles: true

  - id: 7
    text: "有些电话，你永远等不到下一个了。别让你爸妈的那句吃饭了吗，变成你余生都接不到的那通电话。"
    duration_sec: 10
    voice_emotion: "坚定有力，字字清晰"
    camera: "slow_zoom_in"
    bgm_section: "outro"
    material:
      search: "empty chair, sunset, father and son silhouette"
    subtitles: false
