segments:
- id: 1
  text: 当历史的尘埃落定，某些失败却因一句命名而成为传奇。比如‘井冈山’——这个原本只是地理坐标的名字，被赋予了‘革命摇篮’的象征意义。
  duration_sec: 8
  voice_emotion: 开场悬念
  camera: slow_zoom_in
  bgm_section: intro
  material:
    search: 命名赋予历史意义
  subtitles: true
- id: 2
  text: 毛主席擅长用语言重构历史维度。他将‘长征’从单纯的军事撤退，转化为‘战略转移’的史诗叙事，让失败成为民族精神的转折点。
  duration_sec: 12
  voice_emotion: 理性分析
  camera: close_up
  bgm_section: main
  material:
    search: 语言重构历史叙事
  subtitles: true
- id: 3
  text: 这种叙事重构不仅改变历史解释框架，更塑造了集体记忆。‘延安’从军事据点升华为‘精神圣地’，其背后是语言对历史事件的重新编码与价值赋予。
  duration_sec: 15
  voice_emotion: 深度解析
  camera: montage
  bgm_section: climax
  material:
    search: 历史叙事重构案例
  subtitles: true
- id: 4
  text: 毛主席的语言艺术，本质是用精准的符号系统将失败转化为文化资本。这种转化让历史事件超越时间维度，成为民族精神的永恒坐标。
  duration_sec: 10
  voice_emotion: 总结升华
  camera: wide_angle
  bgm_section: outro
  material:
    search: 失败转化为传奇案例
  subtitles: true
