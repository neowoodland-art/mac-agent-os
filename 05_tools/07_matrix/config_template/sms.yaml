# SMS 验证码 API 配置
# 复制本文件到 ../scripts/config/sms.yaml 并填入真实值
#
# API 服务：wx.tyhtak.com（短信转发平台）
# 使用方式：
#   1. cp config_template/sms.yaml scripts/config/sms.yaml
#   2. 填入你的 API Key 和手机号
#   3. 运行养号脚本时会自动读取

sms:
  api_key: "gtmsg2026"              # API 密钥
  phone: "15370103682"               # 接收验证码的手机号
  base_url: "https://wx.tyhtak.com/api/biz/msg/messages"  # API 地址
  poll_interval: 3                   # 轮询间隔（秒）
  timeout: 120                       # 默认超时（秒）
