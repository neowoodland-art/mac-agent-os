# accounts.override.yaml — 本机账号覆写配置 (L1)
# 位置: ~/workbuddy-agent-os/agent-local/tools/matrix/config/accounts.override.yaml
# 同步: 不参与任何同步, 每机独⽴
# 用途: 覆写 registry 中的本机账号的敏感/环境相关字段
#
# 规则:
#   - 只写本机有归属的账号 (assigned_machine == 本机 hostname)
#   - 手机号/代理/启用状态只在这里定义
#   - identity_dir 可覆盖 (如果本机身份目录名不⼀致)
#   - 不存在的字段自动从 registry 继承

version: "1.0"
hostname: "__YOUR_HOSTNAME__"    # 改为本机 hostname

accounts:
  # 示例: douyin_01 的覆写
  - id: douyin_01
    phone: "185xxxx8610"          # 完整手机号
    proxy: ""                     # 代理 (空=不使⽤)
    enabled: true                 # 本机是否启用此账号
    # identity_dir: identities/my_custom_dir  # 可选覆盖

  - id: douyin_02
    phone: "185xxxx3366"
    proxy: ""
    enabled: true

  - id: douyin_camo01
    phone: "153xxxx8283"
    proxy: ""
    enabled: true
