# Matrix 账号配置模板
# ==========================================
# 核心规则: 一手机号 = 一浏览器身份(identity_dir)
# 同手机号的抖音+小红书必须共享 identity_dir!
#
# 本模板复制到 agent-local/tools/matrix/config/accounts.yaml 后使用。
# 敏感字段（手机号）建议写在 accounts.override.yaml 中，而非本文件。
# ==========================================

viewport:
  width: 702
  height: 783
  mobile: false

# Camoufox 全局配置
camoufox:
  executable: ~/Library/Caches/camoufox/Camoufox.app/Contents/MacOS/camoufox
  screen:
    width: 702
    height: 783
  geo:
    timezone: Asia/Shanghai
    locale: zh-CN

accounts:
  # ═══════════════════════════════════════════
  # 账号列表 — 一手机号 = 一 identity_dir
  # ═══════════════════════════════════════════
  #
  # 示例：手机号 185xxxx8610 同时拥有抖音和小红书账号，
  # 两个账号的 identity_dir 指向同一个目录（douyin_01_camo）。
  # 这样登录态（cookie/fingerprint）只存一份，切换平台时用
  # CookieGuard 保护对方平台的 session（见 cookie_manager.py）。
  #
  # 数据分层：
  #   代码 + 配置模板 → agent-sync/ （Gitee 同步）
  #   本机敏感信息   → agent-local/tools/matrix/config/accounts.override.yaml（不同步）
  #   完整配置       → agent-local/tools/matrix/config/accounts.yaml（不同步）
  #
  # 同手机号的 xhs 账号不需要写 identity_dir，MatrixManager 会自动复用
  # douyin 账号的 identity_dir（通过手机号匹配）。
  #
  # ── 可用字段 ──
  #   id:               账号标识，CLI 参数用这个
  #   platform:         douyin | xiaohongshu | zhihu
  #   phone:            手机号（必填，用于身份匹配和短信接收）
  #   identity_dir:     identities/ 下的目录名（可选，不填则用 id 字段）
  #   window:           [宽, 高] 窗口尺寸
  #   window_position:  [X, Y] 多账号防重叠
  #   proxy:            socks5://127.0.0.1:7890（可选）
  #   enabled:          true | false
  #   notes:            备注
  # ═══════════════════════════════════════════

  # ── 账号 1: 手机号 185xxxx8610 ──
  - id: douyin_01
    platform: douyin
    phone: "18513308610"
    identity_dir: identities/douyin_01_camo
    window: [702, 783]
    window_position: [0, 0]
    enabled: true
    notes: "抖音主号（identity 也用于 xhs_01）"

  - id: xhs_01
    platform: xiaohongshu
    phone: "18513308610"
    window: [702, 783]
    window_position: [0, 800]
    enabled: true
    notes: "小红书（共享 douyin_01_camo 身份，无需 identity_dir）"

  # ── 账号 2: 手机号 185xxxx3366 ──
  - id: douyin_02
    platform: douyin
    phone: "18500003366"
    identity_dir: identities/douyin_02_camo
    window: [702, 783]
    window_position: [400, 0]
    enabled: true
    notes: "抖音副号"

  - id: xhs_02
    platform: xiaohongshu
    phone: "18500003366"
    window: [702, 783]
    window_position: [400, 800]
    enabled: true
    notes: "小红书（共享 douyin_02_camo 身份）"

  # ── 账号 3: 手机号 153xxxx8283 ──
  - id: douyin_camo01
    platform: douyin
    phone: "15370108283"
    identity_dir: identities/douyin_camo01
    window: [702, 783]
    window_position: [750, 0]
    enabled: true
    notes: "抖音三号"

  - id: xhs_03
    platform: xiaohongshu
    phone: "15370108283"
    window: [702, 783]
    window_position: [750, 800]
    enabled: true
    notes: "小红书（共享 douyin_camo01 身份）"

  # ── 账号 4: 手机号 185xxxx9083 ──
  - id: douyin_04
    platform: douyin
    phone: "18550099083"
    identity_dir: identities/douyin_04
    window: [702, 783]
    enabled: true
    notes: "抖音四号"

  - id: xhs_04
    platform: xiaohongshu
    phone: "18550099083"
    window: [702, 783]
    enabled: true
    notes: "小红书（共享 douyin_04 身份）"

  # ── 账号 5: 手机号 185xxxx9224 ──
  - id: douyin_05
    platform: douyin
    phone: "18550099224"
    identity_dir: identities/douyin_05
    window: [702, 783]
    enabled: true
