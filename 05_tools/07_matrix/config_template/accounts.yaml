# Matrix 账号配置模板
# 复制到 agent-local/tools/matrix/config/accounts.yaml 后编辑
#
# 同手机号共享身份原则：
# - 同一个手机号只创建一个 identity 目录
# - 在该浏览器 profile 中分别登录抖音和小红书
# - identity_dir 指向同一个目录

accounts:

  # ── 示例：抖音账号 ──
  - id: douyin_01                # 账号ID（唯一标识）
    platform: douyin              # 平台：douyin / xiaohongshu
    phone: "13800138000"          # 手机号（必填）
    display_name: 我的抖音号       # 显示名称（选填）
    enabled: true                 # 启用状态
    browser_type: camoufox        # 浏览器引擎
    profile_dir: phone_13800138000 # 共享身份目录名
    identity_dir: phone_13800138000

  # ── 示例：同手机号小红书账号 ──
  - id: xhs_01                   # 同一手机号
    platform: xiaohongshu
    phone: "13800138000"
    display_name: 我的小红书号
    enabled: true
    browser_type: camoufox
    profile_dir: phone_13800138000 # 指向同一个目录
    identity_dir: phone_13800138000

  # ── 示例：另一个手机号的抖音账号 ──
  - id: douyin_02
    platform: douyin
    phone: "13900139000"
    display_name: 小号
    enabled: true
    browser_type: camoufox
    profile_dir: phone_13900139000
    identity_dir: phone_13900139000

# ── 目录结构说明 ──
#
# agent-local/tools/matrix/
#   identities/
#     phone_13800138000/          ← 身份目录（浏览器指纹+cookie）
#       config.yaml               ← 指纹配置（自动生成）
#       user_data/                ← Camoufox 浏览器 profile
#         cookies.sqlite          ← 登录态（自动维护）
#         cache2/                 ← 浏览器缓存
#         ...
#     phone_13900139000/          ← 另一个手机号的身份
#       ...
#   config/
#     accounts.yaml               ← 本文件
