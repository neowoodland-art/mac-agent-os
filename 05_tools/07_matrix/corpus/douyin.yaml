      role: questioner
    - text: 一般多少钱？
      role: questioner
    - text: 在哪里可以买到？
      role: questioner
    - text: 和其他的比有什么优势？
      role: questioner
    - text: 适合新手吗？
      role: questioner
    templates:
    - text: '{keyword}具体怎么操作？'
      role: questioner
    - text: 能详细讲讲{keyword}吗？
      role: questioner
    - text: '{keyword}难不难学？'
