    - text: 太有同感了
      role: sympathizer
    - text: 终于有人说出这个了
      role: sympathizer
    - text: 看到最后破防了
      role: sympathizer
    - text: 这就是生活啊
      role: sympathizer
    - text: 说得太对了
      role: sympathizer
    - text: 感觉在说我本人
      role: sympathizer
    - text: 同一个世界同一个感受
      role: sympathizer
    - text: 经历过的人才懂
