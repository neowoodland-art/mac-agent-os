    - text: 能分享一下具体方法吗？
      role: questioner
    - text: 新手想问一下怎么入门
      role: questioner
    - text: 这个需要什么工具？
      role: questioner
    - text: 有教程吗？想学
      role: questioner
    - text: 大概需要多长时间？
      role: questioner
    - text: 这个操作难不难？
      role: questioner
    - text: 求推荐入门级的
      role: questioner
    - text: 有没有什么注意事项？
      role: questioner
