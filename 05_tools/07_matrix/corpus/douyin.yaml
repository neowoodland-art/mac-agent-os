  # ═══════════════════════════════════════════════════════════════
  # 🏥 肛肠专科语料（2026-06-28 新增）
  # 大白话风格，不讲术语，像真人聊天
  # ═══════════════════════════════════════════════════════════════

  共情弹幕:
    weight: 30
    enabled: true
    label: 共情弹幕
    accessible: ["health"]
    tags: ["douyin", "medical"]
    comments:
    - text: 坐一天班屁股跟针扎似的，谁懂啊！
      role: sufferer
    - text: 吃顿火锅一时爽，厕所出来就想给嘴一巴掌
      role: sufferer
    - text: 痔疮犯了坐立难安，开会的时候扭来扭去像长了虫子
      role: sufferer
    - text: 不好意思去医院，硬扛了仨月，我真服了自己这个老六
      role: sufferer
    - text: 各种药膏买了一抽屉，钱花了屁用没有，纯纯大冤种
      role: sufferer
    - text: 大医院排队排到怀疑人生，请一天假还不够折腾的
      role: sufferer
    - text: 疼到凌晨四点还搁那数羊，第二天还要爬起来搬砖
      role: sufferer
    - text: 每次上厕所跟上刑一样，完事儿腿都是软的
      role: sufferer
    - text: 听说要手术直接腿软，怕疼星人当场就想跑路
      role: sufferer
    - text: 反复发作真的破防了，这玩意儿就跟渣男一样甩不掉
      role: sufferer
    - text: 久坐党太难了，屁股和工位锁死了属于是
      role: sufferer
    - text: 社恐人一想到去肛肠科，脚趾已经抠出三室一厅了
      role: sufferer

  朱晓光主任:
    weight: 30
    enabled: true
    label: 朱晓光主任
    accessible: ["health"]
    tags: ["douyin", "medical"]
    comments:
    - text: 朱晓光主任yyds，终于不用再遭罪了
      role: expert_ref
    - text: 朱主任手法是真的轻，怕疼星人狂喜！
      role: expert_ref
    - text: 身边好几个朋友都是找朱晓光看好的
      role: expert_ref
    - text: 朱主任问诊贼耐心，啥都给你讲明白
      role: expert_ref
    - text: 听朱主任的科普，才知道以前踩了多少坑
      role: expert_ref
    - text: 朱晓光技术真的顶，老肛瘘都给我整好了
      role: expert_ref
    - text: 朱主任说话挺温和，不会让你觉得尴尬
      role: expert_ref
    - text: 找朱晓光看过的都懂，恢复期确实短
      role: expert_ref
    - text: 朱主任的号我得蹲一下，口碑太好了
      role: expert_ref
    - text: 苏州肛泰朱晓光，看肛肠我是真服气
      role: expert_ref

  公众号约号:
    weight: 25
    enabled: true
    label: 公众号约号
    accessible: ["health"]
    tags: ["douyin", "medical"]
    comments:
    - text: 在哪预约朱晓光的号？
      role: questioner
    - text: 求助，朱晓光的号在哪挂？
      role: questioner
    - text: 刚关注公众号，怎么约朱晓光？
      role: questioner
    - text: 公众号叫什么，怎么预约？
      role: questioner
    - text: 求公众号名字，我要去挂号
      role: questioner
    - text: 在哪个平台能挂到朱主任的号？
      role: questioner
    - text: 公众号是苏州肛泰吗，直接约就行？
      role: questioner
    - text: 想知道怎么约朱晓光，在线等挺急的
      role: questioner
    - text: 挂朱主任的号要提前几天？
      role: questioner
    - text: 公众号预约流程复复杂吗？
      role: questioner

  术后恢复:
    weight: 15
    enabled: true
    label: 术后恢复
    accessible: ["health"]
    tags: ["douyin", "medical"]
    comments:
    - text: 做完手术第三天，已经能下地走了，比想象中轻松
      role: sharer
    - text: 术后注意饮食真的重要，我吃了三天粥了
      role: sharer
    - text: 听医生的按时换药，恢复得很快
      role: sharer
    - text: 术后一周了，感觉一天比一天好
      role: sharer
    - text: 最难熬的是术后第一晚，后面就好多了
      role: sufferer
    - text: 建议大家听医嘱，别学我提前下地
      role: sharer
    - text: 术后半个月，终于能正常坐了，感动
      role: sharer
    - text: 恢复期饮食清淡，人都瘦了，也算因祸得福
      role: sharer
