# 视觉分析配置
# oMLX: 本地模型（优先）
omlx:
  base_url: "http://127.0.0.1:8000/v1"
  api_key: "omlx"
  model: "Qwen2.5-VL-3B-Instruct-8bit"

# DashScope: 远程备用（阿里百炼）
# ⚠️ api_key 不入库 — 真实值在 agent-local/tools/ave/config/local.yaml → aliyun.api_key
#    或环境变量 DASHSCOPE_API_KEY (vision_bridge.get_dashscope_key 统一读取)
dashscope:
  api_key: "sk-xxx"
  model: "qwen-vl-plus"  # 性价比高，支持图片理解
  # 更便宜的选择: qwen-vl-max (更强) / qwen2.5-vl-7b (开源版)
