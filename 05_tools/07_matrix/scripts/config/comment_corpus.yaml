# 评论语料库 v1.0
#
# 分类结构：大类 → 子类 → 评论内容/模板
# 权重越高，被选中的概率越大
# 模板用 {keyword} 动态替换为当前视频关键词
#
# 你可以手动编辑此文件：
# - 新增评论直接加在对应分类下
# - 新增分类在 categories 下加一个 key 即可
# - 不想用的分类把 weight 设为 0

categories:
  # ── 1. 通用赞美 ──
  praise:
    label: "通用赞美"
    weight: 4
    comments:
      - "说得太好了"
      - "学到了，感谢分享"
      - "很有道理"
      - "好内容，值得收藏"
      - "讲得很透彻"
      - "支持一下"
      - "确实如此"
      - "说得太对了"
      - "收藏了慢慢看"
      - "好文，已三连"

  # ── 2. 内容相关 ──
  content_related:
    label: "内容相关"
    weight: 3
    templates:
      - "这个{keyword}太有意思了"
      - "第一次看到{keyword}的讲解"
      - "关于{keyword}讲得很透彻"
      - "{keyword}还能这么理解，学习了"
      - "对{keyword}又有新的认识"
    comments:
      - "这个角度很新颖"
      - "终于有人讲明白了"
      - "深入浅出，好讲解"

  # ── 3. 互动提问 ──
  interactive:
    label: "互动提问"
    weight: 2
    comments:
      - "有懂的大佬吗？"
      - "请问这个是什么原理？"
      - "能出一期详细教程吗？"
      - "这个在哪里可以买到？"
      - "有没有相关的推荐？"
      - "请问up主用的什么设备？"

  # ── 4. 引导评论（重点，可定向引导） ──
  guided:
    label: "引导评论"
    weight: 1
    description: "用于特定目的引导，根据当前养的号类型选择启用"
    tags:
      - "general"   # 通用引导
      - "promote"   # 推广引导
      - "debate"    # 争议引导
    comments:
      - "有没有和我一样在看第二遍的"
      - "看完这个我终于懂了"
      - "我试了一下真的有用"
      - "这个方法我用了三个月了"
      - "推荐给所有需要的朋友"
      - "有没有人组队一起学的"

  # ── 5. 表情/符号 ──
  emoji:
    label: "表情符号"
    weight: 1
    comments:
      - "👍"
      - "❤️"
      - "👏"
      - "🔥"
      - "太棒了👍"
      - "已收藏❤️"

  # ── 6. 调侃幽默 ──
  humor:
    label: "调侃幽默"
    weight: 1
    comments:
      - "老师讲得很好，下次别讲了（狗头）"
      - "脑子：学会了 手：？？？"
      - "我的表情和封面一模一样"
      - "建议直接发我脑子里"
      - "全程张着嘴看完的"
      - "这个视频是我付费能看的吗？"

  # ── 7. 行业术语（可自定义） ──
  industry:
    label: "行业术语"
    weight: 0  # 默认关闭，需要时打开
    description: "根据养号领域自定义，如编程/金融/美食等"
    tags:
      - "tech"
      - "finance"
    comments:
      - "这个API设计得很优雅"
      - "性能优化做得很到位"
      - "架构设计值得参考"


# ── 全局配置 ──
config:
  # 默认启用的分类（填分类key，为空则启用所有weight>0的分类）
  enabled_categories: []

  # 默认禁用的分类（填分类key）
  disabled_categories:
    - "industry"

  # 当前养号领域（用于模板填充 {keyword}）
  niche: "general"

  # 是否优先使用模板（带{keyword}的评论）
  prefer_templates: true
