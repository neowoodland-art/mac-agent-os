<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系统监控面板</title>
<style>
:root {
  --bg: #0f1117; --bg2: #1a1d2e; --bg3: #232740;
  --text: #e1e4f0; --text2: #8b8fa3;
  --primary: #6366f1; --primary-dim: #4f46e5;
  --green: #22c55e; --red: #ef4444; --amber: #f59e0b; --blue: #3b82f6;
  --border: #2a2d3e; --radius: 10px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh; display: flex; }
.sidebar { width: 220px; background: var(--bg2); padding: 24px 16px;
  border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
.sidebar h1 { font-size: 18px; margin-bottom: 24px; display: flex; align-items: center; gap: 8px; }
.sidebar h1 span { background: var(--primary); padding: 2px 8px; border-radius: 4px; font-size: 11px; }
.nav-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 4px;
  color: var(--text2); transition: .15s; display: flex; align-items: center; gap: 10px; font-size: 14px; }
.nav-item:hover { background: var(--bg3); color: var(--text); }
.nav-item.active { background: var(--primary); color: #fff; }
.main { flex: 1; padding: 24px 32px; overflow-y: auto; max-height: 100vh; }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 28px; }
.stat-card { background: var(--bg2); border-radius: var(--radius); padding: 20px; border: 1px solid var(--border); }
.stat-card .label { font-size: 12px; color: var(--text2); text-transform: uppercase; letter-spacing: .5px; }
.stat-card .value { font-size: 28px; font-weight: 700; margin-top: 6px; }
.stat-card .sub { font-size: 12px; color: var(--text2); margin-top: 4px; }

/* Table */
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
th { color: var(--text2); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
tr:hover td { background: var(--bg3); cursor: pointer; }
.badge { padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
.badge-完成, .badge-completed { background: rgba(34,197,94,.15); color: var(--green); }
.badge-失败, .badge-failed { background: rgba(239,68,68,.15); color: var(--red); }
.badge-运行中, .badge-running { background: rgba(59,130,246,.15); color: var(--blue); }

/* Detail View */
.detail-header { margin-bottom: 24px; }
.detail-header h2 { font-size: 20px; margin-bottom: 8px; }
.detail-meta { display: flex; gap: 20px; font-size: 13px; color: var(--text2); }
.step-list { margin-bottom: 28px; }
.step-item { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); gap: 12px; }
.step-item .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.step-item .name { flex: 1; font-size: 13px; }
.step-item .meta { font-size: 12px; color: var(--text2); }

/* Filter bar */
.filter-bar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.filter-bar select, .filter-bar input { background: var(--bg2); border: 1px solid var(--border);
  color: var(--text); padding: 8px 12px; border-radius: 6px; font-size: 13px; }
.filter-bar input { flex: 1; min-width: 200px; }
.filter-bar button { background: var(--primary); color: #fff; border: none; padding: 8px 16px;
  border-radius: 6px; cursor: pointer; font-size: 13px; }
.filter-bar button:hover { background: var(--primary-dim); }

/* Cost breakdown */
.cost-bar { display: flex; height: 24px; border-radius: 6px; overflow: hidden; margin: 12px 0; }
.cost-bar div { display: flex; align-items: center; justify-content: center; font-size: 10px; color: #fff; }

/* Section title */
.section-title { font-size: 14px; font-weight: 600; margin: 20px 0 12px; color: var(--text2); }

/* Asset grid */
.asset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 12px; }
.asset-card { background: var(--bg2); border-radius: var(--radius); padding: 14px; border: 1px solid var(--border); }
.asset-card .type { font-size: 11px; color: var(--primary); text-transform: uppercase; letter-spacing: .5px; }
.asset-card .name { font-size: 13px; margin: 4px 0; }
.asset-card .meta { font-size: 11px; color: var(--text2); }

/* Chart placeholder */
.chart-box { background: var(--bg2); border-radius: var(--radius); padding: 20px;
  border: 1px solid var(--border); margin-bottom: 16px; }

/* Pagination */
.pagination { display: flex; justify-content: center; gap: 6px; margin-top: 16px; }
.pagination button { background: var(--bg2); border: 1px solid var(--border); color: var(--text);
  padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.pagination button:hover { background: var(--bg3); }
.pagination button.active { background: var(--primary); border-color: var(--primary); }

.loading { text-align: center; padding: 40px; color: var(--text2); }
.error { text-align: center; padding: 20px; color: var(--red); }
.hidden { display: none; }

@media (max-width: 768px) {
  .sidebar { width: 60px; padding: 16px 8px; }
  .sidebar h1 span, .nav-item span { display: none; }
  .main { padding: 16px; }
  .stats { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>
<nav class="sidebar">
  <h1>🖥 系统监控 <span>v1</span></h1>
  <div style="margin-bottom:16px;padding:8px 12px;background:var(--bg3);border-radius:8px;font-size:12px;color:var(--text2);">
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">
      <span style="width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;"></span>
      <span id="pluginBadge">AVE 视频工厂</span>
    </div>
    <div style="font-size:11px;color:var(--text2);opacity:.7;">模块: <span id="pluginCount">1</span> 个</div>
  </div>
  <div class="nav-item active" data-view="productions" onclick="switchView('productions')">📋 生产列表</div>
  <div class="nav-item" data-view="assets" onclick="switchView('assets')">💾 资产</div>
  <div class="nav-item" data-view="costs" onclick="switchView('costs')">💰 费用</div>
  <div style="flex:1"></div>
  <div class="nav-item" onclick="location.reload()">🔄 刷新</div>
</nav>
<main class="main" id="app">

<!-- Stats bar -->
<div class="stats" id="statsBar"></div>

<!-- Production list view -->
<div id="view-productions">
  <div class="filter-bar">
    <select id="filterStrategy"><option value="">全部策略</option>
      <option>口播</option><option>卡点</option><option>数字人</option><option>test</option>
    </select>
    <select id="filterStatus"><option value="">全部状态</option>
      <option value="completed">已完成</option><option value="failed">失败</option><option value="running">运行中</option>
    </select>
    <input id="searchInput" placeholder="搜索脚本名称..." oninput="debounceSearch()">
    <button onclick="loadProductions()">查询</button>
  </div>
  <div id="productionList"></div>
  <div class="pagination" id="pagination"></div>
</div>

<!-- Asset view -->
<div id="view-assets" class="hidden">
  <div class="filter-bar">
    <select id="assetTypeFilter"><option value="">全部类型</option>
      <option value="generated_clip">视频片段</option><option value="character_sheet">定妆照</option><option value="bgm">背景音乐</option><option value="script">脚本</option>
    </select>
    <input id="assetSearch" placeholder="搜索标签..." oninput="debounceAssetSearch()">
    <button onclick="loadAssets()">查询</button>
  </div>
  <div id="assetList"></div>
</div>

<!-- Cost view -->
<div id="view-costs" class="hidden">
  <div id="costSummary"></div>
  <div id="costBreakdown"></div>
</div>

<!-- Production detail modal -->
<div id="detailModal" class="hidden"></div>

</main>
<script>
// ── State ──
const API = '';
let currentView = 'productions';
let currentPage = 0;
const PAGE_SIZE = 30;
let searchTimer;

// ── Init ──
loadStats();
loadProductions();
loadPlugins();

// ── Navigation ──
function switchView(view) {
  currentView = view;
  document.querySelectorAll('.nav-item').forEach(e => e.classList.toggle('active', e.dataset.view === view));
  ['productions','assets','costs'].forEach(v => {
    document.getElementById('view-' + v).classList.toggle('hidden', v !== view);
  });
  if (view === 'productions') loadProductions();
  if (view === 'assets') loadAssets();
  if (view === 'costs') loadCosts();
}

// ── Stats ──
async function loadStats() {
  try {
    const r = await fetch(`${API}/api/summary`);
    const d = await r.json();
    // 从插件式响应中提取 AVE 数据
    const ave = d.ave || d;
    document.getElementById('statsBar').innerHTML = `
      <div class="stat-card"><div class="label">总产量</div><div class="value">${ave.total_productions||0}</div><div class="sub">本月 ${ave.month_productions||0}</div></div>
      <div class="stat-card"><div class="label">累计费用</div><div class="value">¥${(ave.total_cost||0).toFixed(2)}</div><div class="sub">本月 ¥${(ave.month_cost||0).toFixed(2)}</div></div>
      <div class="stat-card"><div class="label">成功</div><div class="value" style="color:var(--green)">${ave.completed||0}</div></div>
      <div class="stat-card"><div class="label">失败</div><div class="value" style="color:var(--red)">${ave.failed||0}</div></div>
      <div class="stat-card"><div class="label">资产总数</div><div class="value">${ave.total_assets||0}</div></div>
    `;
  } catch(e) { document.getElementById('statsBar').innerHTML = `<div class="error">❌ 连接失败</div>`; }
}

// ── Productions ──
async function loadProductions(page) {
  if (page !== undefined) currentPage = page;
  const el = document.getElementById('productionList');
  el.innerHTML = '<div class="loading">加载中...</div>';
  try {
    const strategy = document.getElementById('filterStrategy').value;
    const status = document.getElementById('filterStatus').value;
    const search = document.getElementById('searchInput').value;
    const params = new URLSearchParams({limit: PAGE_SIZE, offset: currentPage * PAGE_SIZE});
    if (strategy) params.set('strategy', strategy);
    if (status) params.set('status', status);
    const r = await fetch(`${API}/api/productions?${params}`);
    const data = await r.json();

    if (!data.length) { el.innerHTML = '<div class="error" style="padding:40px">暂无生产记录</div>'; return; }

    const filtered = search ? data.filter(p => (p.script_name||'').includes(search)) : data;
    if (!filtered.length) { el.innerHTML = '<div class="error">未找到匹配记录</div>'; return; }

    el.innerHTML = `<table><thead><tr>
      <th>编号</th><th>策略</th><th>脚本</th><th>状态</th><th>费用</th><th>时长</th><th>时间</th>
    </tr></thead><tbody>${filtered.map(p => `<tr onclick="showDetail(${p.id})">
      <td>#${p.id}</td>
      <td>${p.strategy||'-'}</td>
      <td>${(p.script_name||'').slice(0,30)||'-'}</td>
      <td><span class="badge badge-${(p.status||'unknown').toLowerCase()}">${p.status}</span></td>
      <td>¥${(p.total_cost||0).toFixed(2)}</td>
      <td>${p.duration_sec ? p.duration_sec.toFixed(0) + 's' : '-'}</td>
      <td style="white-space:nowrap">${(p.created_at||'').slice(0,16)}</td>
    </tr>`).join('')}</tbody></table>`;

    // Pagination
    document.getElementById('pagination').innerHTML = currentPage > 0
      ? `<button onclick="loadProductions(${currentPage-1})">← 上一页</button><span style="padding:6px 12px;color:var(--text2)">第 ${currentPage+1} 页</span><button onclick="loadProductions(${currentPage+1})">下一页 →</button>`
      : `<span style="padding:6px 12px;color:var(--text2)">第 1 页</span><button onclick="loadProductions(${currentPage+1})">下一页 →</button>`;
    loadStats();
  } catch(e) { el.innerHTML = `<div class="error">❌ 加载失败: ${e.message}</div>`; }
}

function debounceSearch() { clearTimeout(searchTimer); searchTimer = setTimeout(() => loadProductions(0), 400); }

// ── Detail ──
async function showDetail(id) {
  const el = document.getElementById('detailModal');
  el.classList.remove('hidden');
  el.innerHTML = '<div class="loading" style="padding:60px">加载详情...</div>';
  try {
    const r = await fetch(`${API}/api/productions/${id}`);
    const d = await r.json();
    const p = d.production;
    const steps = d.steps || [];
    const assets = d.assets || [];
    const costs = d.costs || [];

    el.innerHTML = `<div style="position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:20px" onclick="event.target===this&&closeDetail()">
      <div style="background:var(--bg2);border-radius:12px;max-width:800px;width:100%;max-height:85vh;overflow-y:auto;padding:24px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <div class="detail-header"><h2>#${p.id} ${p.strategy||''}</h2></div>
          <button onclick="closeDetail()" style="background:var(--bg3);border:none;color:var(--text);padding:6px 14px;border-radius:6px;cursor:pointer">✕ 关闭</button>
        </div>
        <div class="detail-meta">
          <span>状态: <span class="badge badge-${(p.status||'').toLowerCase()}">${p.status}</span></span>
          <span>时长: ${p.duration_sec ? p.duration_sec.toFixed(0) + 's' : '-'}</span>
          <span>费用: ¥${(p.total_cost||0).toFixed(2)}</span>
          <span>输出: ${(p.output_path||'-').slice(-30)}</span>
        </div>
        ${p.error_message ? `<div style="margin-top:12px;padding:10px;background:rgba(239,68,68,.1);border-radius:6px;color:var(--red);font-size:13px">${p.error_message}</div>` : ''}

        <div class="section-title">📋 步骤 (${steps.length})</div>
        <div class="step-list">${steps.length ? steps.map(s => `<div class="step-item">
          <div class="dot" style="background:${s.status==='completed'?'var(--green)':s.status==='failed'?'var(--red)':'var(--amber)'}"></div>
          <span class="name">${s.step_name}</span>
          <span class="meta">${s.detail||''}${s.cost ? ' ¥'+s.cost.toFixed(2) : ''}</span>
          ${s.error_message ? `<span style="color:var(--red);font-size:12px">${s.error_message}</span>` : ''}
        </div>`).join('') : '<div style="color:var(--text2);padding:10px">无步骤记录</div>'}</div>

        <div class="section-title">💰 费用明细 (${costs.length})</div>
        ${costs.length ? `<table><thead><tr><th>服务</th><th>时长</th><th>费用</th><th>备注</th></tr></thead><tbody>${costs.map(c => `<tr><td>${c.service||'-'}</td><td>${c.duration_s ? c.duration_s+'s' : c.chars ? c.chars+'字' : '-'}</td><td>¥${(c.cost_yuan||0).toFixed(2)}</td><td>${c.note||''}</td></tr>`).join('')}</tbody></table>`
        : '<div style="color:var(--text2);padding:10px">无费用记录</div>'}

        <div class="section-title">💾 资产 (${assets.length})</div>
        <div class="asset-grid">${assets.length ? assets.map(a => `<div class="asset-card">
          <div class="type">${a.asset_type||'-'}</div>
          <div class="name">${(a.name||a.file_path||'-').slice(0,40)}</div>
          <div class="meta">${a.source||''}${a.file_size ? ' · '+(a.file_size/1024).toFixed(0)+'KB' : ''}</div>
          ${a.tags ? `<div style="margin-top:6px;display:flex;gap:4px;flex-wrap:wrap">${a.tags.split(',').map(t => `<span style="background:var(--bg3);padding:1px 6px;border-radius:4px;font-size:10px">${t}</span>`).join('')}</div>` : ''}
        </div>`).join('') : '<div style="color:var(--text2);padding:10px">无关联资产</div>'}</div>
      </div>
    </div>`;
  } catch(e) { el.innerHTML = `<div class="error">❌ 加载失败</div>`; }
}
function closeDetail() { document.getElementById('detailModal').classList.add('hidden'); }

// ── Assets ──
async function loadAssets(page) {
  const el = document.getElementById('assetList');
  el.innerHTML = '<div class="loading">加载中...</div>';
  try {
    const type = document.getElementById('assetTypeFilter').value;
    const tag = document.getElementById('assetSearch').value;
    const params = new URLSearchParams({limit: 50});
    if (type) params.set('type', type);
    if (tag) params.set('tag', tag);
    const r = await fetch(`${API}/api/assets?${params}`);
    const data = await r.json();
    if (!data.length) { el.innerHTML = '<div class="error" style="padding:40px">暂无资产</div>'; return; }
    el.innerHTML = `<div class="asset-grid">${data.map(a => `<div class="asset-card" onclick="showDetail(${a.production_id})" style="cursor:pointer">
      <div class="type">${a.asset_type||'-'}</div>
      <div class="name">${(a.name||a.file_path||'-').slice(0,40)}</div>
      <div class="meta">${a.source||''}${a.file_size ? ' · '+(a.file_size/1024).toFixed(0)+'KB' : ''}</div>
      ${a.tags ? `<div style="margin-top:6px;display:flex;gap:4px;flex-wrap:wrap">${a.tags.split(',').map(t => `<span style="background:var(--bg3);padding:1px 6px;border-radius:4px;font-size:10px">${t}</span>`).join('')}</div>` : ''}
    </div>`).join('')}</div>`;
  } catch(e) { el.innerHTML = `<div class="error">❌ 加载失败</div>`; }
}
function debounceAssetSearch() { clearTimeout(searchTimer); searchTimer = setTimeout(() => loadAssets(), 400); }

// ── Costs ──
async function loadCosts() {
  const el1 = document.getElementById('costSummary');
  const el2 = document.getElementById('costBreakdown');
  try {
    const r = await fetch(`${API}/api/summary`);
    const d = await r.json();
    const s = d.ave || d;
    el1.innerHTML = `<div class="stats" style="grid-template-columns:repeat(3,1fr)">
      <div class="stat-card"><div class="label">总费用</div><div class="value">¥${(s.total_cost||0).toFixed(2)}</div></div>
      <div class="stat-card"><div class="label">本月费用</div><div class="value">¥${(s.month_cost||0).toFixed(2)}</div></div>
      <div class="stat-card"><div class="label">平均费用/生产</div><div class="value">¥${s.total_productions ? (s.total_cost/s.total_productions).toFixed(2) : '0.00'}</div></div>
    </div>`;

    // 按策略统计 (专用API)
    const r2 = await fetch(`${API}/api/costs/breakdown`);
    const strategies = await r2.json();
    const colors = ['#6366f1','#22c55e','#f59e0b','#ef4444','#3b82f6'];

    if (!strategies.length) {
      el2.innerHTML = '<div class="error" style="padding:40px">暂无费用数据</div>';
      return;
    }

    const maxCost = Math.max(...strategies.map(s => s.total_cost), 1);
    el2.innerHTML = `<div class="chart-box">
      <div style="font-size:14px;font-weight:600;margin-bottom:12px">按策略统计</div>
      <div class="cost-bar">${strategies.map((s,i) => `<div style="flex:${(s.total_cost/maxCost*100).toFixed(0)};background:${colors[i%5]};min-width:20px" title="${s.strategy}: ¥${s.total_cost.toFixed(2)}">¥${s.total_cost.toFixed(0)}</div>`).join('')}</div>
      <table><thead><tr><th>策略</th><th>次数</th><th>总时长</th><th>总费用</th><th>平均费用</th></tr></thead><tbody>
        ${strategies.map(s => `<tr><td>${s.strategy}</td><td>${s.count}</td><td>${(s.total_duration||0).toFixed(0)}s</td><td>¥${(s.total_cost||0).toFixed(2)}</td><td>¥${s.avg_cost||'0.00'}</td></tr>`).join('')}
      </tbody></table>
    </div>`;
  } catch(e) { el1.innerHTML = `<div class="error">❌ 加载失败: ${e.message}</div>`; }
}

// ── Plugins ──
async function loadPlugins() {
  try {
    const r = await fetch(`${API}/api/plugins`);
    const d = await r.json();
    const plugins = d.plugins || [];
    const avail = plugins.filter(p => p.available);
    const badge = document.getElementById('pluginBadge');
    const count = document.getElementById('pluginCount');
    if (badge && avail.length) {
      badge.textContent = avail.map(p => p.label).join(' · ');
    }
    if (count) count.textContent = avail.length;
  } catch(e) { /* 插件信息非关键 */ }
}

// ── Keyboard ──
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });</script>
</body>
</html>
