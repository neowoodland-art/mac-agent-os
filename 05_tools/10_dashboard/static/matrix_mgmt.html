<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matrix 养号管理面板</title>
<style>
:root {
  --bg: #0f1117; --bg2: #1a1d2e; --bg3: #232740;
  --text: #e1e4f0; --text2: #8b8fa3;
  --primary: #6366f1; --primary-dim: #4f46e5;
  --green: #22c55e; --red: #ef4444; --amber: #f59e0b; --blue: #3b82f6;
  --border: #2a2d3e; --radius: 10px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh; }
.container { max-width: 1400px; margin: 0 auto; padding: 20px; }

.header { display: flex; align-items: center; justify-content: space-between;
  padding: 16px 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
.header h1 { font-size: 22px; display: flex; align-items: center; gap: 10px; }
.header h1 span { background: var(--primary); padding: 2px 8px; border-radius: 4px; font-size: 11px; }
.header-right { display: flex; gap: 8px; align-items: center; }

.tabs { display: flex; gap: 4px; margin-bottom: 20px; flex-wrap: wrap; }
.tab { padding: 10px 20px; border-radius: 8px; cursor: pointer; background: var(--bg2);
  color: var(--text2); border: 1px solid var(--border); font-size: 14px; transition: .15s; }
.tab:hover { background: var(--bg3); color: var(--text); }
.tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
.stat-card { background: var(--bg2); border-radius: var(--radius); padding: 16px; border: 1px solid var(--border); }
.stat-card .label { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: .5px; }
.stat-card .value { font-size: 24px; font-weight: 700; margin-top: 4px; }
.stat-card .sub { font-size: 11px; color: var(--text2); margin-top: 2px; }

table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
th { color: var(--text2); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
tr:hover td { background: var(--bg3); }

.badge { padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; display: inline-block; }
.badge-green { background: rgba(34,197,94,.15); color: var(--green); }
.badge-red { background: rgba(239,68,68,.15); color: var(--red); }
.badge-amber { background: rgba(245,158,11,.15); color: var(--amber); }
.badge-blue { background: rgba(59,130,246,.15); color: var(--blue); }
.badge-gray { background: rgba(139,143,163,.15); color: var(--text2); }

.btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; transition: .15s; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dim); }
.btn-danger { background: rgba(239,68,68,.2); color: var(--red); border: 1px solid rgba(239,68,68,.3); }
.btn-danger:hover { background: rgba(239,68,68,.3); }
.btn-sm { padding: 4px 10px; font-size: 11px; }
.btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
.btn-outline:hover { background: var(--bg3); }

.card { background: var(--bg2); border-radius: var(--radius); padding: 20px; border: 1px solid var(--border); margin-bottom: 16px; }
.card-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
.flex { display: flex; gap: 8px; }
.flex-wrap { flex-wrap: wrap; }
.items-center { align-items: center; }
.gap-4 { gap: 16px; }
.mt-4 { margin-top: 16px; }
.mb-2 { margin-bottom: 8px; }
.text-sm { font-size: 13px; }
.text-xs { font-size: 11px; }
.text-muted { color: var(--text2); }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; }

input, select, textarea { background: var(--bg3); border: 1px solid var(--border); color: var(--text);
  padding: 8px 12px; border-radius: 6px; font-size: 13px; width: 100%; }
input:focus, select:focus { outline: none; border-color: var(--primary); }
label { font-size: 12px; color: var(--text2); margin-bottom: 4px; display: block; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 12px; }

.modal-overlay { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.7);
  display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal-box { background: var(--bg2); border-radius: 12px; max-width: 800px; width: 100%;
  max-height: 85vh; overflow-y: auto; padding: 24px; }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.modal-header h2 { font-size: 18px; }

.loading { text-align: center; padding: 40px; color: var(--text2); }
.error { text-align: center; padding: 20px; color: var(--red); }
.hidden { display: none !important; }

/* Atom ops */
.ops-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.op-card { background: var(--bg3); border-radius: 8px; padding: 12px; border: 1px solid var(--border); cursor: pointer; transition: .15s; position: relative; }
.op-card:hover { border-color: var(--primary); }
.op-card.selected { border-color: var(--green); background: rgba(34,197,94,.1); }
.op-card.invalid-target { opacity: .4; cursor: not-allowed; }
.op-card .op-label { font-size: 13px; font-weight: 600; }
.op-card .op-cat { font-size: 10px; color: var(--text2); margin-top: 2px; }
.op-card .op-desc { font-size: 11px; color: var(--text2); margin-top: 4px; }
.op-card .op-dep { font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-top: 4px; display: inline-block; }

.step-list { margin: 8px 0; }
.step-item { display: flex; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); gap: 8px; }
.step-item .step-num { width: 24px; height: 24px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: 11px; flex-shrink: 0; }
.step-item .step-num.invalid { background: var(--red); color: #fff; }
.step-item .step-num.valid { background: var(--primary); color: #fff; }
.step-item .step-name { flex: 1; font-size: 13px; }
.step-item .step-del { cursor: pointer; color: var(--red); font-size: 16px; opacity: .6; }
.step-item .step-del:hover { opacity: 1; }
.step-arrow { color: var(--text2); font-size: 11px; padding: 0 4px; }
.flow-vis { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; margin: 8px 0; padding: 10px; background: var(--bg3); border-radius: 8px; }
.flow-node { padding: 4px 10px; border-radius: 4px; font-size: 11px; white-space: nowrap; }
.flow-arrow { color: var(--text2); font-size: 14px; }

/* Backup */
.backup-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.backup-card { background: var(--bg3); border-radius: 8px; padding: 12px; border: 1px solid var(--border); }
.backup-card .b-identity { font-weight: 600; font-size: 13px; }
.backup-card .b-meta { font-size: 11px; color: var(--text2); margin-top: 4px; }
.backup-card .b-actions { margin-top: 8px; display: flex; gap: 6px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📱 Matrix 养号管理 <span>v3.1</span></h1>
    <div class="header-right">
      <span id="hostDisplay" style="font-size:12px;color:var(--text2)"></span>
      <button class="btn btn-outline btn-sm" onclick="loadAll()">⟳ 刷新</button>
      <button class="btn btn-outline btn-sm" onclick="window.location.href='/'">← 主面板</button>
    </div>
  </div>

  <div class="stats" id="statsBar"></div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('accounts',this)">👤 账号管理</div>
    <div class="tab" onclick="switchTab('blueprints',this)">📋 蓝图编排</div>
    <div class="tab" onclick="switchTab('atomops',this)">⚡ 原子操作</div>
    <div class="tab" onclick="switchTab('backup',this)">💾 备份恢复</div>
    <div class="tab" onclick="switchTab('importexport',this)">📦 导入导出</div>
  </div>

  <!-- ═══════════════════ Accounts Panel ═══════════════════ -->
  <div id="panel-accounts">
    <div class="card">
      <div class="card-title">
        <span>账号列表</span>
        <button class="btn btn-primary btn-sm" onclick="showCreateAccount()">+ 新建账号</button>
      </div>
      <div id="accountList"><div class="loading">加载中...</div></div>
    </div>
  </div>

  <!-- ═══════════════════ Blueprints Panel ═══════════════════ -->
  <div id="panel-blueprints" class="hidden">
    <div class="card">
      <div class="card-title">
        <span>蓝图列表</span>
        <button class="btn btn-primary btn-sm" onclick="showCreateBlueprint()">+ 新建蓝图</button>
      </div>
      <div id="blueprintList"><div class="loading">加载中...</div></div>
    </div>
  </div>

  <!-- ═══════════════════ Atom Ops Panel ═══════════════════ -->
  <div id="panel-atomops" class="hidden">
    <div class="card">
      <div class="card-title">
        <span>原子操作库（含依赖约束）</span>
        <span id="atomOpCount" style="font-size:12px;color:var(--text2)"></span>
      </div>
      <div id="atomOpList"><div class="loading">加载中...</div></div>
    </div>
  </div>

  <!-- ═══════════════════ Backup Panel ═══════════════════ -->
  <div id="panel-backup" class="hidden">
    <div class="stats" style="grid-template-columns:1fr 1fr 1fr">
      <div class="card" style="margin:0">
        <div class="card-title">📸 创建快照</div>
        <p class="text-sm text-muted mb-2">备份所有身份的 Cookie + 配置文件</p>
        <div class="form-row"><div><label>标签</label><input id="backupLabel" value="manual" placeholder="自定义标签"></div></div>
        <button class="btn btn-primary" onclick="createBackup()">创建备份</button>
        <div id="backupCreateResult" class="mt-4 text-sm"></div>
      </div>
      <div class="card" style="margin:0">
        <div class="card-title">🔄 备份列表</div>
        <p class="text-sm text-muted mb-2">按身份分组的最新备份</p>
        <div id="backupListSummary"></div>
      </div>
      <div class="card" style="margin:0">
        <div class="card-title">⬆ 快速备份</div>
        <p class="text-sm text-muted mb-2">一键备份所有身份</p>
        <button class="btn btn-primary" onclick="quickBackup()">⬆ 一键备份</button>
        <div id="quickBackupResult" class="mt-4 text-sm"></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title"><span>📋 所有备份历史</span></div>
      <div id="backupDetailList"><div class="loading">加载备份列表...</div></div>
    </div>
  </div>

  <!-- ═══════════════════ Import/Export Panel ═══════════════════ -->
  <div id="panel-importexport" class="hidden">
    <div class="stats" style="grid-template-columns:1fr 1fr">
      <div class="card" style="margin:0">
        <div class="card-title">📤 导出</div>
        <p class="text-sm text-muted mb-2">导出所有账号配置 + Cookie + 指纹</p>
        <button class="btn btn-primary" onclick="exportAccounts()">导出 ZIP</button>
        <div id="exportResult" class="mt-4 text-sm"></div>
      </div>
      <div class="card" style="margin:0">
        <div class="card-title">📥 导入</div>
        <p class="text-sm text-muted mb-2">从 ZIP 文件导入</p>
        <div class="form-row"><div><label>ZIP 路径</label><input id="importPath" placeholder="/tmp/matrix_export.zip"></div></div>
        <div class="flex items-center gap-4">
          <button class="btn btn-primary" onclick="importAccounts()">导入</button>
          <label class="text-sm" style="display:flex;align-items:center;gap:4px;cursor:pointer">
            <input type="checkbox" id="importOverwrite"> 覆盖
          </label>
        </div>
        <div id="importResult" class="mt-4 text-sm"></div>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div id="modalOverlay" class="modal-overlay hidden" onclick="if(event.target===this)closeModal()">
  <div class="modal-box" id="modalContent"></div>
</div>

<script>
const API = '';
let ALL_OPS = [];       // All atomic ops with dependency info
let OPS_MAP = {};       // name → op detail
let blueprintSteps = []; // Current editing blueprint steps

// ── Init ──
loadAll();
async function loadAll() {
  await Promise.all([loadSystemInfo(), loadAccounts(), loadBlueprints(), loadAtomOps(), loadBackups()]);
}
async function loadSystemInfo() {
  try {
    const r = await fetch(`${API}/api/matrix/system-info`);
    const info = await r.json();
    document.getElementById('statsBar').innerHTML = `
      <div class="stat-card"><div class="label">总账号</div><div class="value">${info.total_accounts}</div></div>
      <div class="stat-card"><div class="label">已启用</div><div class="value" style="color:var(--green)">${info.enabled_accounts}</div></div>
      <div class="stat-card"><div class="label">已登录</div><div class="value" style="color:var(--blue)">${info.logged_in_accounts}</div></div>
      <div class="stat-card"><div class="label">身份目录</div><div class="value">${info.identity_dirs}</div></div>
      <div class="stat-card"><div class="label">蓝图</div><div class="value" style="color:var(--amber)">${info.blueprints}</div></div>
    `;
  } catch(e) {}
}

function switchTab(name, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  ['accounts','blueprints','atomops','backup','importexport'].forEach(p => {
    document.getElementById('panel-' + p).classList.toggle('hidden', p !== name);
  });
  if (name === 'backup') loadBackups();
}

// ════════════════════════════════════════════════════════
// ACCOUNT MANAGEMENT
// ════════════════════════════════════════════════════════

async function loadAccounts() {
  const el = document.getElementById('accountList');
  el.innerHTML = '<div class="loading">加载中...</div>';
  try {
    const r = await fetch(`${API}/api/matrix/accounts`);
    const data = await r.json();
    const accts = data.accounts || [];
    if (!accts.length) { el.innerHTML = '<div class="error">暂无账号</div>'; return; }

    el.innerHTML = `<table><thead><tr>
      <th>ID</th><th>平台</th><th>手机</th><th>登录</th><th>身份目录</th><th>窗口</th><th>启用</th><th>操作</th>
    </tr></thead><tbody>${accts.map(a => {
      const sb = statusBadge(a._status);
      const dirExists = a._identity_dir_exists ? '✅' : '❌';
      return `<tr>
        <td><strong>${a.id}</strong></td>
        <td>${a.platform==='douyin'?'🎵':'📕'} ${a.platform}</td>
        <td>${(a.phone||'-').slice(0,11)}</td>
        <td><span class="badge ${sb.cls}">${sb.txt}</span></td>
        <td class="text-xs"><span title="${a.identity_dir||''}">${dirExists} ${(a.identity_dir||'-').split('/').pop()}</span></td>
        <td class="text-xs text-muted">${(a.window||['-','-']).join('×')}</td>
        <td>${a.enabled ? '✅' : '⏸'}</td>
        <td>
          <button class="btn btn-sm btn-outline" onclick="showEditAccount('${a.id}')">编辑</button>
          <button class="btn btn-sm btn-danger" onclick="deleteAccount('${a.id}')">删</button>
          ${a.enabled ? `<button class="btn btn-sm btn-primary" onclick="startNurture('${a.id}')">养号</button>` : ''}
        </td>
      </tr>`;
    }).join('')}</tbody></table>`;
  } catch(e) { el.innerHTML = `<div class="error">${e.message}</div>`; }
}

function statusBadge(s) {
  if (s === 'logged_in') return {cls:'badge-green', txt:'✅ 已登录'};
  if (s === 'no_cookie') return {cls:'badge-amber', txt:'⚠️ 无Cookie'};
  if (s === 'no_session') return {cls:'badge-amber', txt:'⚠️ 无Session'};
  if (s === 'disabled') return {cls:'badge-gray', txt:'⏸ 停用'};
  if (s === 'empty_cookie') return {cls:'badge-amber', txt:'⚠️ Cookie空'};
  return {cls:'badge-red', txt:'❌ '+(s||'未知')};
}

function showCreateAccount() {
  showModal(`
    <div class="modal-header"><h2>+ 新建账号</h2></div>
    <div class="form-row">
      <div><label>账号ID *</label><input id="fa-id" placeholder="douyin_03"></div>
      <div><label>平台 *</label><select id="fa-platform"><option value="douyin">抖音</option><option value="xiaohongshu">小红书</option></select></div>
    </div>
    <div class="form-row">
      <div><label>手机号</label><input id="fa-phone" placeholder="185xxxx1234"></div>
      <div><label>身份目录名</label><input id="fa-identity" placeholder="留空自动生成"></div>
    </div>
    <div class="form-row-3">
      <div><label>窗口宽</label><input id="fa-w" value="702"></div>
      <div><label>窗口高</label><input id="fa-h" value="783"></div>
      <div><label>代理</label><input id="fa-proxy" placeholder="socks5://..."></div>
    </div>
    <div class="form-row">
      <div><label>X位置</label><input id="fa-posx" value="0"></div>
      <div><label>Y位置</label><input id="fa-posy" value="0"></div>
    </div>
    <p class="text-xs text-muted">身份目录将自动创建在 agent-local/tools/matrix/identities/ 下</p>
    <div class="flex mt-4">
      <button class="btn btn-primary" onclick="createAccount()">创建</button>
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
    </div>
  `);
}
async function createAccount() {
  const id = document.getElementById('fa-id').value;
  if (!id) { alert('请输入账号ID'); return; }
  const data = {
    id, platform: document.getElementById('fa-platform').value,
    phone: document.getElementById('fa-phone').value,
    identity_dir: document.getElementById('fa-identity').value ? 'identities/'+document.getElementById('fa-identity').value : undefined,
    window: [parseInt(document.getElementById('fa-w').value)||702, parseInt(document.getElementById('fa-h').value)||783],
    window_position: [parseInt(document.getElementById('fa-posx').value)||0, parseInt(document.getElementById('fa-posy').value)||0],
    proxy: document.getElementById('fa-proxy').value || null, enabled: true,
  };
  try {
    const r = await fetch(`${API}/api/matrix/accounts`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)});
    if (!r.ok) { const e=await r.json(); throw new Error(e.detail); }
    closeModal(); loadAccounts(); loadSystemInfo();
  } catch(e) { alert('❌ '+e.message); }
}

function showEditAccount(id) {
  fetch(`${API}/api/matrix/accounts/${id}`).then(r=>r.json()).then(a => {
    showModal(`
      <div class="modal-header"><h2>编辑: ${a.id}</h2></div>
      <div class="form-row">
        <div><label>平台</label><select id="fe-platform"><option value="douyin" ${a.platform==='douyin'?'selected':''}>抖音</option><option value="xiaohongshu" ${a.platform==='xiaohongshu'?'selected':''}>小红书</option></select></div>
        <div><label>手机</label><input id="fe-phone" value="${a.phone||''}"></div>
      </div>
      <div class="form-row">
        <div><label>身份目录</label><input id="fe-identity" value="${a.identity_dir||''}">
          <span style="font-size:11px;color:var(--text2)">⚠️ 修改目录会影响登录态</span></div>
        <div><label>启用</label><select id="fe-enabled"><option value="true" ${a.enabled?'selected':''}>启用</option><option value="false" ${!a.enabled?'selected':''}>停用</option></select></div>
      </div>
      <div class="form-row">
        <div><label>备注</label><input id="fe-notes" value="${(a.notes||'').replace(/"/g,'&quot;')}"></div>
        <div><label>代理</label><input id="fe-proxy" value="${a.proxy||''}"></div>
      </div>
      <div class="flex mt-4">
        <button class="btn btn-primary" onclick="updateAccount('${a.id}')">保存</button>
        <button class="btn btn-outline" onclick="closeModal()">取消</button>
      </div>
    `);
  }).catch(e => alert('❌ '+e.message));
}
async function updateAccount(id) {
  try {
    const r = await fetch(`${API}/api/matrix/accounts/${id}`, {method:'PUT', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({platform: document.getElementById('fe-platform').value, phone: document.getElementById('fe-phone').value,
        enabled: document.getElementById('fe-enabled').value==='true',
        identity_dir: document.getElementById('fe-identity').value,
        notes: document.getElementById('fe-notes').value, proxy: document.getElementById('fe-proxy').value||null})});
    if (!r.ok) { const e=await r.json(); throw new Error(e.detail); }
    closeModal(); loadAccounts();
  } catch(e) { alert('❌ '+e.message); }
}
async function deleteAccount(id) {
  if (!confirm(`确定删除 ${id}？`)) return;
  const delIdent = confirm(`同时删除身份目录(Cookie/指纹)？\n"确定"=删除，"取消"=保留`);
  try {
    const r = await fetch(`${API}/api/matrix/accounts/${id}?delete_identity=${delIdent}`, {method:'DELETE'});
    if (!r.ok) { const e=await r.json(); throw new Error(e.detail); }
    loadAccounts(); loadSystemInfo();
  } catch(e) { alert('❌ '+e.message); }
}
async function startNurture(id) {
  if (!confirm(`启动养号: ${id} (10轮)？`)) return;
  try {
    const r = await fetch(`${API}/api/matrix/nurture/start`, {method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({accounts:[id], rounds:10, daemon:false})});
    const res = await r.json();
    alert(`✅ 已启动\n日志: ${res.log||'N/A'}`);
  } catch(e) { alert('❌ '+e.message); }
}

async function loadBlueprints() {
  const el = document.getElementById('blueprintList');
  el.innerHTML = '<div class="loading">加载中...</div>';
  try {
    const r = await fetch(`${API}/api/matrix/blueprints`);
    const data = await r.json();
    const bps = data.blueprints || [];
    if (!bps.length) { el.innerHTML = '<div class="error">暂无蓝图</div>'; return; }
    el.innerHTML = `<table><thead><tr>
      <th>名称</th><th>类型</th><th>步骤</th><th>平台</th><th>说明</th><th>操作</th>
    </tr></thead><tbody>${bps.map(b => `<tr>
      <td><strong>${b.name}</strong></td>
      <td>${b.type||'综合'}</td>
      <td><span class="badge badge-blue">${b.step_count}</span></td>
      <td>${b.platform||'douyin'}</td>
      <td class="text-sm text-muted truncate">${(b.description||'').slice(0,30)}</td>
      <td>
        <button class="btn btn-sm btn-outline" onclick="editBlueprint('${b.name}')">编排</button>
        <button class="btn btn-sm btn-danger" onclick="deleteBlueprint('${b.name}')">删</button>
      </td>
    </tr>`).join('')}</tbody></table>`;
  } catch(e) { el.innerHTML = `<div class="error">${e.message}</div>`; }

async function loadAtomOps() {
  try {
    const r = await fetch(`${API}/api/matrix/atom-ops`);
    const data = await r.json();
    ALL_OPS = data.ops || [];
    OPS_MAP = {};
    ALL_OPS.forEach(o => OPS_MAP[o.name] = o);
    document.getElementById('atomOpCount').textContent = `共 ${ALL_OPS.length} 个操作`;

    // Render atom ops in the standalone view
    const el = document.getElementById('atomOpList');
    const groups = {};
    ALL_OPS.forEach(o => { const g = o.category||'其他'; if(!groups[g]) groups[g]=[]; groups[g].push(o); });
    const catLabels = {navigation:'🏠 导航', browse:'📱 浏览', interact:'💡 交互', xhs:'📕 小红书', utility:'⏳ 工具', auto:'⚙️ 自动发现'};
    el.innerHTML = Object.entries(groups).map(([g,items]) => `<div style="margin-bottom:16px">
      <div style="font-size:13px;font-weight:600;margin-bottom:8px;color:var(--text2)">${catLabels[g]||g} (${items.length})</div>
      <div class="ops-grid">${items.map(o => {
        const req = o.requires && o.requires.length ? `<span class="op-dep" style="background:rgba(59,130,246,.15);color:var(--blue)">← 需: ${o.requires.filter(r=>r!=='*').map(r=>OPS_MAP[r]?OPS_MAP[r].label||r:r).join(', ')||'无'}</span>` : '<span class="op-dep" style="background:rgba(34,197,94,.15);color:var(--green)">✅ 可为首步</span>';
        const nxt = o.allows && o.allows.length && o.allows[0] !== '*' ? `<span class="op-dep" style="background:rgba(139,143,163,.15);color:var(--text2)">→ 后继: ${o.allows.slice(0,4).map(n=>OPS_MAP[n]?OPS_MAP[n].label||n:n).join(', ')}${o.allows.length>4?'…':''}</span>` : '';
        return `<div class="op-card" style="cursor:default">
          <div class="op-label">${o.label||o.name}</div>
          <div class="op-cat">${o.type||o.category} · ${o.source||'graph'}</div>
          <div class="op-desc">${o.desc||''}</div>
          <div style="margin-top:6px">${req} ${nxt}</div>
        </div>`;
      }).join('')}</div></div>`).join('');
  } catch(e) { document.getElementById('atomOpList').innerHTML = `<div class="error">${e.message}</div>`; }
}

function showCreateBlueprint() {
  blueprintSteps = [];
  showModal(`
    <div class="modal-header"><h2>+ 新建蓝图</h2></div>
    <div class="form-row">
      <div><label>蓝图名称 *</label><input id="fb-name" placeholder="my_blueprint"></div>
      <div><label>平台</label><select id="fb-platform"><option value="douyin">抖音</option><option value="xiaohongshu">小红书</option></select></div>
    </div>
    <div><label>说明</label><input id="fb-desc" placeholder="可选"></div>
    <div class="mt-4 mb-2" style="font-weight:600;font-size:14px;color:var(--text2)">⚡ 选择原子操作（灰色=当前不可选）</div>
    <div id="fb-ops-grid" class="ops-grid"><div class="loading">加载中...</div></div>
    <div class="mt-4">
      <div style="font-weight:600;font-size:14px;color:var(--text2) mb-2">📋 编排步骤（可点击操作添加）</div>
      <div id="blueprint-flow" class="flow-vis"><span style="color:var(--text2);font-size:12px">空蓝图</span></div>
      <div id="fb-steps" class="step-list" style="min-height:40px;border:1px dashed var(--border);padding:8px;border-radius:6px">
        <div style="color:var(--text2);font-size:12px;text-align:center">选择上方步骤添加到蓝图</div>
      </div>
    </div>
    <div id="fb-errors" class="mt-4"></div>
    <div class="flex mt-4">
      <button class="btn btn-primary" onclick="saveBlueprint()">保存蓝图</button>
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
    </div>
  `);
  renderBlueprintOps();
  renderBlueprintSteps();
}

function renderBlueprintOps() {
  const container = document.getElementById('fb-ops-grid');
  if (!container) return;

  const lastStep = blueprintSteps.length > 0 ? blueprintSteps[blueprintSteps.length-1] : null;
  const prevNames = blueprintSteps.map(s => s.name);

  container.innerHTML = ALL_OPS.map((o, i) => {
    // Check if this op can follow the last step
    const canAdd = canOpFollow(o, lastStep, prevNames);
    const selected = blueprintSteps.some(s => s.name === o.name && s._idx === i);
    return `<div class="op-card ${selected?'selected':''} ${canAdd?'':'invalid-target'}"
      onclick="${canAdd ? `addOpToBlueprint('${o.name}',${i})` : ''}"
      title="${canAdd ? '点击添加到步骤末尾' : '当前步骤不可选，请检查前置依赖'}">
      <div class="op-label">${o.label||o.name}</div>
      <div class="op-cat">${o.category||o.type}</div>
      <div class="op-desc">${o.desc||''}</div>
      ${renderOpConstraints(o)}
    </div>`;
  }).join('');
}

function canOpFollow(op, lastStep, prevNames) {
  if (!op) return false;
  if (!lastStep && op.can_be_first) return true;  // First step, must be an entry point
  if (!lastStep && !op.can_be_first) return false;

  // Check if prev op allows this one
  if (lastStep) {
    const prevInfo = OPS_MAP[lastStep.name];
    if (prevInfo && prevInfo.allows && prevInfo.allows[0] !== '*' && !prevInfo.allows.includes(op.name)) {
      return false;
    }
  }

  // Check prerequisites (must appear somewhere in the step list, not necessarily adjacent)
  if (op.requires && op.requires.length > 0 && op.requires[0] !== '*') {
    const allPrev = prevNames.join(',');
    if (!op.requires.some(r => allPrev.includes(r))) {
      return false;
    }
  }

  return true;
}

function renderOpConstraints(o) {
  let html = '';
  if (o.requires && o.requires.length > 0 && o.requires[0] !== '*') {
    html += `<div style="margin-top:4px"><span class="badge badge-blue" style="font-size:9px">← 需前序: ${o.requires.map(r => OPS_MAP[r] ? OPS_MAP[r].label||r : r).join(', ')}</span></div>`;
  } else if (o.can_be_first) {
    html += `<div style="margin-top:4px"><span class="badge badge-green" style="font-size:9px">✅ 可为首步</span></div>`;
  }
  if (o.allows && o.allows.length > 0 && o.allows[0] !== '*') {
    html += `<div style="margin-top:2px"><span class="badge badge-gray" style="font-size:9px">→ 后继: ${o.allows.slice(0,3).map(n => OPS_MAP[n] ? OPS_MAP[n].label||n : n).join(', ')}${o.allows.length>3?'…':''}</span></div>`;
  }
  return html;
}

function addOpToBlueprint(name, idx) {
  const op = OPS_MAP[name];
  if (!op) return;
  blueprintSteps.push({name, _idx: idx, label: op.label||name, category: op.category});
  renderBlueprintSteps();
  renderBlueprintOps();
}

function removeBlueprintStep(idx) {
  blueprintSteps.splice(idx, 1);
  renderBlueprintSteps();
  renderBlueprintOps();
}

function renderBlueprintSteps() {
  const listEl = document.getElementById('fb-steps');
  const flowEl = document.getElementById('blueprint-flow');
  if (!listEl) return;

  if (!blueprintSteps.length) {
    listEl.innerHTML = '<div style="color:var(--text2);font-size:12px;text-align:center;padding:10px">选择上方操作添加到步骤</div>';
    if (flowEl) flowEl.innerHTML = '<span style="color:var(--text2);font-size:12px">空蓝图</span>';
    return;
  }

  // Flow visualization
  if (flowEl) {
    flowEl.innerHTML = blueprintSteps.map((s, i) => `
      <span class="flow-node" style="background:var(--primary);color:#fff">${s.label}</span>
      ${i < blueprintSteps.length - 1 ? '<span class="flow-arrow">→</span>' : ''}
    `).join('');
  }

  // Step list
  listEl.innerHTML = blueprintSteps.map((s, i) => {
    const prevOp = i > 0 ? OPS_MAP[blueprintSteps[i-1].name] : null;
    const curOp = OPS_MAP[s.name];
    let isError = false;
    // Check first step constraint
    if (i === 0 && curOp && !curOp.can_be_first) { isError = true; }
    // Check adjacency constraint
    if (i > 0 && prevOp && curOp && prevOp.allows && prevOp.allows[0] !== '*' && !prevOp.allows.includes(s.name)) { isError = true; }
    return `<div class="step-item">
      <div class="step-num ${isError?'invalid':'valid'}">${i+1}</div>
      <div class="step-name">
        <strong>${s.label}</strong>
        <span class="text-xs text-muted">(${s.category})</span>
        ${isError ? '<span style="color:var(--red);font-size:11px;margin-left:6px">⚠️ 依赖冲突</span>' : ''}
      </div>
      <div class="step-del" onclick="removeBlueprintStep(${i})">✕</div>
    </div>`;
  }).join('');

  // Validation
  validateBlueprint();
}

async function validateBlueprint() {
  const el = document.getElementById('fb-errors');
  if (!el) return;
  if (blueprintSteps.length === 0) { el.innerHTML = ''; return; }

  try {
    const r = await fetch(`${API}/api/matrix/blueprints/validate`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({steps: blueprintSteps.map(s => ({name: s.name}))})
    });
    const result = await r.json();
    if (result.valid) {
      el.innerHTML = '<div style="padding:8px;background:rgba(34,197,94,.1);border-radius:6px;color:var(--green);font-size:13px">✅ 编排合法</div>';
    } else {
      el.innerHTML = '<div style="padding:8px;background:rgba(239,68,68,.1);border-radius:6px;color:var(--red);font-size:13px">' +
        (result.errors||[]).map(e => `⚠️ 步骤${e.step}: ${e.msg}`).join('<br>') + '</div>';
    }
  } catch(e) {
    el.innerHTML = '<div style="color:var(--amber)">⚠️ 校验服务暂不可用</div>';
  }
}

async function saveBlueprint() {
  const name = document.getElementById('fb-name').value;
  if (!name) { alert('请输入蓝图名称'); return; }
  if (!blueprintSteps.length) { alert('请添加至少一个步骤'); return; }
  const steps = blueprintSteps.map(s => ({name: s.name, type: s.category, description: (OPS_MAP[s.name]||{}).desc||''}));
  try {
    const r = await fetch(`${API}/api/matrix/blueprints`, {method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name, description:document.getElementById('fb-desc').value, platform:document.getElementById('fb-platform').value, steps})});
    if (!r.ok) { const e=await r.json(); throw new Error(e.detail); }
    closeModal(); loadBlueprints();
  } catch(e) { alert('❌ '+e.message); }
}

function editBlueprint(name) {
  fetch(`${API}/api/matrix/blueprints`).then(r=>r.json()).then(data => {
    const bp = (data.blueprints||[]).find(b => b.name === name);
    if (!bp) return;
    blueprintSteps = (bp.steps||[]).map(s => ({name: s.name||s, label: (OPS_MAP[s.name||s]||{}).label||s.name||s, category: s.type||''}));
    showModal(`
      <div class="modal-header"><h2>编排: ${name}</h2></div>
      <div class="form-row">
        <div><label>名称</label><input id="fb-name" value="${name}" disabled style="opacity:.6"></div>
        <div><label>平台</label><select id="fb-platform"><option value="douyin">抖音</option><option value="xiaohongshu">小红书</option></select></div>
      </div>
      <div><label>说明</label><input id="fb-desc" value="${(bp.description||'').replace(/"/g,'&quot;')}"></div>
      <div class="mt-4 mb-2" style="font-weight:600;font-size:14px;color:var(--text2)">⚡ 原子操作（灰色=当前不可选）</div>
      <div id="fb-ops-grid" class="ops-grid"><div class="loading">加载中...</div></div>
      <div class="mt-4">
        <div style="font-weight:600;font-size:14px;color:var(--text2) mb-2">📋 步骤</div>
        <div id="blueprint-flow" class="flow-vis"></div>
        <div id="fb-steps" class="step-list" style="min-height:40px;border:1px dashed var(--border);padding:8px;border-radius:6px"></div>
      </div>
      <div id="fb-errors" class="mt-4"></div>
      <div class="flex mt-4">
        <button class="btn btn-primary" onclick="saveBlueprint()">保存</button>
        <button class="btn btn-outline" onclick="closeModal()">取消</button>
      </div>
    `);
    renderBlueprintSteps();
    renderBlueprintOps();
  }).catch(e => alert('❌ '+e.message));
}

async function deleteBlueprint(name) {
  if (!confirm(`删除蓝图 ${name}？`)) return;
  try {
    const r = await fetch(`${API}/api/matrix/blueprints/${name}`, {method:'DELETE'});
    if (!r.ok) { const e=await r.json(); throw new Error(e.detail); }
    loadBlueprints();
  } catch(e) { alert('❌ '+e.message); }
}

async function loadBackups() {
  try {
    const r = await fetch(`${API}/api/matrix/backups`);
    const data = await r.json();
    const backups = data.backups || [];

    // Summary by identity
    const groups = {};
    backups.forEach(b => {
      if (!groups[b.identity]) groups[b.identity] = [];
      groups[b.identity].push(b);
    });

    const summaryEl = document.getElementById('backupListSummary');
    summaryEl.innerHTML = Object.entries(groups).map(([ident, baks]) => {
      const latest = baks[0];
      return `<div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:12px">
        <strong>${ident}</strong><br>
        <span class="text-muted">${baks.length} 备份 · 最新: ${latest.time_str} (${latest.label})</span>
      </div>`;
    }).join('') || '<div class="text-muted text-sm">暂无备份</div>';

    // Detail list
    const detailEl = document.getElementById('backupDetailList');
    detailEl.innerHTML = backups.length ? `<table><thead><tr>
      <th>身份</th><th>时间</th><th>标签</th><th>大小</th><th>操作</th>
    </tr></thead><tbody>${backups.slice(0,50).map(b => `<tr>
      <td><strong>${b.identity}</strong></td>
      <td class="text-sm">${b.time_str}</td>
      <td><span class="badge badge-blue">${b.label||b.platform}</span></td>
      <td class="text-xs text-muted">${b.size_kb} KB</td>
      <td><button class="btn btn-sm btn-outline" onclick="restoreBackup('${b.identity}','${b.path}')">恢复</button></td>
    </tr>`).join('')}</tbody></table>` : '<div class="text-muted text-sm" style="padding:20px;text-align:center">暂无备份历史</div>';
  } catch(e) { document.getElementById('backupDetailList').innerHTML = `<div class="error">${e.message}</div>`; }
}

async function createBackup() {
  const label = document.getElementById('backupLabel').value || 'manual';
  const el = document.getElementById('backupCreateResult');
  el.innerHTML = '<div class="loading" style="padding:10px">备份中...</div>';
  try {
    const r = await fetch(`${API}/api/matrix/backup`, {method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({label})});
    const res = await r.json();
    el.innerHTML = `<div style="padding:8px;background:rgba(34,197,94,.1);border-radius:6px;font-size:13px">
      ✅ 完成: ${res.backup_count||0} 个身份已备份</div>`;
    loadBackups();
  } catch(e) { el.innerHTML = `<div class="error">${e.message}</div>`; }
}

async function quickBackup() {
  const el = document.getElementById('quickBackupResult');
  el.innerHTML = '<div class="loading" style="padding:10px">备份中...</div>';
  try {
    const r = await fetch(`${API}/api/matrix/backup`, {method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({label:'quick_' + Date.now()})});
    const res = await r.json();
    el.innerHTML = `<div style="padding:8px;background:rgba(34,197,94,.1);border-radius:6px;font-size:13px">
      ✅ ${res.backup_count||0} 个身份已备份</div>`;
    loadBackups();
  } catch(e) { el.innerHTML = `<div class="error">${e.message}</div>`; }
}

async function restoreBackup(identity, path) {
  if (!confirm(`确定从备份恢复 ${identity} 的 Cookie？\n当前状态将先自动备份。`)) return;
  try {
    const r = await fetch(`${API}/api/matrix/restore`, {method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({identity, path})});
    if (!r.ok) { const e=await r.json(); throw new Error(e.detail); }
    const res = await r.json();
    alert(`✅ 恢复成功\n身份: ${res.identity}\n大小: ${res.size_kb} KB`);
    loadBackups(); loadAccounts();
  } catch(e) { alert('❌ '+e.message); }
}

async function exportAccounts() {
  const el = document.getElementById('exportResult');
  el.innerHTML = '<div class="loading">导出中...</div>';
  try {
    const r = await fetch(`${API}/api/matrix/export`);
    const res = await r.json();
    el.innerHTML = `<div style="padding:8px;background:rgba(34,197,94,.1);border-radius:6px;font-size:13px">
      ✅ 导出成功<br>路径: ${res.path}<br>大小: ${res.size_kb} KB</div>`;
  } catch(e) { el.innerHTML = `<div class="error">${e.message}</div>`; }
}

async function importAccounts() {
  const path = document.getElementById('importPath').value;
  if (!path) { alert('请输入ZIP路径'); return; }
  const el = document.getElementById('importResult');
  el.innerHTML = '<div class="loading">导入中...</div>';
  const overwrite = document.getElementById('importOverwrite').checked;
  try {
    const r = await fetch(`${API}/api/matrix/import`, {method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({path, overwrite})});
    if (!r.ok) { const e=await r.json(); throw new Error(e.detail); }
    const res = await r.json();
    el.innerHTML = `<div style="padding:8px;background:rgba(34,197,94,.1);border-radius:6px;font-size:13px">
      ✅ 导入完成 · 配置:${res.accounts_imported} · 身份:${res.identities_imported}
      ${res.warnings.length ? '<br><span style="color:var(--amber)">⚠️ '+res.warnings.join(', ')+'</span>' : ''}</div>`;
    loadAccounts(); loadSystemInfo();
  } catch(e) { el.innerHTML = `<div class="error">${e.message}</div>`; }
}
