meta:
  project_id: "vid_nature_clouds_001"
  style: "knowledge_lecture"
  voice:
    provider: "aliyun"
    voice_id: "cosyvoice-v3.5-plus-bailian-f92cac2a41ce4fc78153c6097755a60e"
    default_emotion: "自然温和"
  bgm:
    provider: "mlx-audiocraft"
    mood: "calm"
  output:
    resolution: "1080x1920"
    fps: 30
  material:
    fallback: true

segments:
  - id: 1
    text: "在中国西南部的崇山峻岭之间，有一片被云海环绕的神秘之地。"
    duration_sec: 8
    voice_emotion: "温柔开场"
    camera: "slow_zoom_in"
    material:
      source: "pexels"
      search: "mountains clouds sunrise"
    subtitles: true

  - id: 2
    text: "每天清晨，当第一缕阳光穿透云层，整个山谷都被染成了金色。"
    duration_sec: 10
    voice_emotion: "惊喜，温暖"
    camera: "slow_pan_right"
    material:
      source: "pexels"
      search: "sunrise golden light mountains"
    subtitles: true

  - id: 3
    text: "云海翻涌，如同白色的海洋，山峰在云层中若隐若现。"
    duration_sec: 8
    voice_emotion: "沉浸描述"
    camera: "static"
    material:
      source: "pexels"
      search: "cloud sea mountain peak"
    subtitles: true

  - id: 4
    text: "这里的空气清新而凛冽，每一次呼吸都让人感到心旷神怡。"
    duration_sec: 8
    voice_emotion: "舒缓"
    camera: "slow_zoom_out"
    material:
      source: "pexels"
      search: "fresh air forest sky"
    subtitles: true

  - id: 5
    text: "对于生活在城市中的人来说，这样的景色是一种奢侈的享受。"
    duration_sec: 8
    voice_emotion: "感慨"
    camera: "push_in"
    material:
      source: "pexels"
      search: "city skyline sunrise contrast"
    subtitles: true

  - id: 6
    text: "如果有机会，一定要亲自来这里看一看。因为有些美景，照片永远无法传达。"
    duration_sec: 10
    voice_emotion: "温暖收尾"
    camera: "slow_zoom_in"
    material:
      source: "pexels"
      search: "travel hiking mountaintop view"
    subtitles: true
